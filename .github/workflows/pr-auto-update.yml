name: PR auto-update

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-prs:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Update open PR branches
        uses: actions/github-script@v7
        with:
          script: |

            const base = context.ref.replace(/^refs\/heads\//, '');
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base,
              per_page: 100,
            });
            for (const pr of prs) {
              if (pr.draft || pr.user?.type === 'Bot') {
                core.info(`Skip #${pr.number} (draft/bot)`);
                continue;
              }
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                core.info(`Updated #${pr.number}`);
              } catch (error) {
                core.warning(`#${pr.number}: ${error.message}`);
              }
            }
